name: Build sec_ts_y79a (Windows ARM64 driver)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # WDK: runner windows-2022 co VS2022 + SDK 10.0.26100 nhung KHONG co WDK.
      # Thu nhieu cach: winget (co the fail) -> chocolatey -> download truc tiep
      # ------------------------------------------------------------------
      - name: Install WDK (winget)
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== [1] winget WDK ==="
          winget install --id Microsoft.WindowsWDK.10.0.26100 -e `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          Write-Host "winget exit=$LASTEXITCODE"

      - name: Install WDK (chocolatey)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          $hasKm = Get-ChildItem $kits -Directory -ErrorAction SilentlyContinue |
                   Where-Object { Test-Path (Join-Path $_.FullName 'km\wdm.h') }
          if ($hasKm) { Write-Host "WDK da co, bo qua chocolatey"; exit 0 }
          Write-Host "=== [2] chocolatey wdk ==="
          choco install -y --no-progress windowsdriverkit10 || Write-Host "choco fail: $LASTEXITCODE"

      - name: Locate toolchain (chan doan day du)
        if: always()
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "=== VS instances ==="
          & $vswhere -all -products * -format value -property installationPath
          Write-Host "=== MSBuild ==="
          $mb = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe
          Write-Host "msbuild = $mb"
          Write-Host "=== Windows Kits\Include ==="
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          Get-ChildItem "$kits\Include" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $wdm = Join-Path $_.FullName 'km\wdm.h'
            Write-Host ("  {0}  km\wdm.h={1}" -f $_.Name, (Test-Path $wdm))
          }
          Write-Host "=== Windows Kits\Lib ==="
          Get-ChildItem "$kits\Lib" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.Name) }
          Write-Host "=== WDF kmdf arm64 versions ==="
          $wdf = Join-Path $kits 'Lib\wdf\kmdf\arm64'
          if (Test-Path $wdf) { Get-ChildItem $wdf -Directory | ForEach-Object { Write-Host ("  " + $_.Name) } }
          else { Write-Host "  <khong co $wdf>" }
          Write-Host "=== cl.exe arm64 ==="
          $msvcRoot = "${env:ProgramFiles}\Microsoft Visual Studio\2022"
          $msvc = Get-ChildItem "$msvcRoot\*\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msvc) {
            Write-Host ("  MSVC dir = " + $msvc.FullName)
            Write-Host ("  Hostx64\arm64\cl.exe = " + (Test-Path (Join-Path $msvc.FullName 'bin\Hostx64\arm64\cl.exe')))
            Write-Host ("  lib\arm64           = " + (Test-Path (Join-Path $msvc.FullName 'lib\arm64')))
          } else { Write-Host "  <khong thay MSVC>" }

      # ------------------------------------------------------------------
      # BUILD CHINH: MSBuild + PlatformToolset WindowsKernelModeDriver10.0
      # In TOAN BO log ra man hinh de doc truc tiep tren GitHub
      # ------------------------------------------------------------------
      - name: Build driver (MSBuild)
        id: msbuild
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $mb = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          Write-Host "msbuild = $mb"
          if (-not $mb) { Write-Host "!! khong co MSBuild"; exit 1 }

          Write-Host ""
          Write-Host "=== MSBUILD OUTPUT (day du) ==="
          & $mb sec_ts_y79a.vcxproj /p:Configuration=Release /p:Platform=ARM64 /t:Build /v:normal /nologo 2>&1 |
            ForEach-Object { Write-Host $_ }
          $rc = $LASTEXITCODE
          Write-Host "=== msbuild exit = $rc ==="
          exit $rc

      # ------------------------------------------------------------------
      # Neu MSBuild fail: build thu cong, in day du log
      # ------------------------------------------------------------------
      - name: Fallback manual build (in day du log)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== FALLBACK MANUAL BUILD ==="
          powershell -ExecutionPolicy Bypass -File .\build_manual.ps1 2>&1 | ForEach-Object { Write-Host $_ }
          if (Test-Path .\build_manual_log.txt) {
            Write-Host ""
            Write-Host "=== build_manual_log.txt (day du) ==="
            Get-Content .\build_manual_log.txt | ForEach-Object { Write-Host $_ }
          }

      # ------------------------------------------------------------------
      # Fallback 2: cl/link truc tiep (build_rsp2.ps1) voi log day du
      # ------------------------------------------------------------------
      - name: Fallback rsp build (in day du log)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== FALLBACK RSP BUILD ==="
          powershell -ExecutionPolicy Bypass -File .\build_rsp2.ps1 2>&1 | ForEach-Object { Write-Host $_ }

      - name: Ket qua cuoi cung
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== TIM .sys TREN TOAN BO WORKSPACE ==="
          $found = Get-ChildItem -Recurse -Filter *.sys -ErrorAction SilentlyContinue
          if ($found) {
            $found | ForEach-Object { Write-Host ("  {0}  {1} B" -f $_.FullName, $_.Length) }
          } else { Write-Host "  <khong co .sys nao>" }
          Write-Host "=== TIM .cat/.inf ==="
          Get-ChildItem -Recurse -Include *.cat,*.inf -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("  " + $_.FullName) }

      - name: Upload driver package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec_ts_y79a-driver
          path: |
            **/*.sys
            **/*.cat
            **/*.inf
            **/build_*.txt
            **/*.log
          if-no-files-found: warn